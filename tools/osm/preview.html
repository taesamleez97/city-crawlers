<!doctype html>
<!-- Top-down check of a built city file: /tools/osm/preview.html?city=seoul (dev server). -->
<html>
<head>
  <meta charset="utf-8" />
  <title>City preview</title>
  <style>
    body { margin: 0; background: #222; color: #eee; font: 14px system-ui; }
    canvas { display: block; }
    #info { position: fixed; left: 8px; top: 8px; background: #000a; padding: 6px 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="info"></div>
  <canvas id="c" width="1400" height="1400"></canvas>
  <script type="module">
    const id = new URLSearchParams(location.search).get("city") ?? "seoul";
    const d = await (await fetch(`/cities/${id}.json`)).json();
    const c = document.getElementById("c"), g = c.getContext("2d");
    const W = (c.width = innerWidth), H = (c.height = innerHeight);
    const path = d.route.path.map(([x, z]) => [x / 10, z / 10]);
    const xs = path.map((p) => p[0]), zs = path.map((p) => p[1]);
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cz = (Math.min(...zs) + Math.max(...zs)) / 2;
    const zoom = Number(new URLSearchParams(location.search).get("zoom") ?? 1);
    const s = (Math.min(W, H) / Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...zs) - Math.min(...zs), 400)) * 0.8 * zoom;
    const X = (x) => W / 2 + (x / 10 - cx) * s, Y = (z) => H / 2 + (z / 10 - cz) * s;
    const poly = (pts, close) => {
      g.beginPath();
      for (let i = 0; i < pts.length; i += 2) (i ? g.lineTo : g.moveTo).call(g, X(pts[i]), Y(pts[i + 1]));
      if (close) g.closePath();
    };
    g.fillStyle = "#cfcfcf";
    g.fillRect(0, 0, W, H);
    for (const [k, pts] of d.areas) {
      g.fillStyle = ["", "#8c6", "#4bd", "#e8dcc8"][k];
      poly(pts, true);
      g.fill();
    }
    for (const [k, w, pts] of d.lines) {
      g.strokeStyle = k === 1 ? "#4bd" : "#987";
      g.lineWidth = (w / 10) * s;
      poly(pts, false);
      g.stroke();
    }
    for (const [cls, w, pts] of d.roads) {
      g.strokeStyle = cls === 5 ? "#e9dfcf" : "#555b66";
      g.lineWidth = Math.max(1, (w / 10) * s);
      g.lineCap = "round";
      poly(pts, false);
      g.stroke();
    }
    for (const [h, min, type, col, lm, pts] of d.buildings) {
      const hh = h < 0 ? 15 : h / 10;
      const t = Math.min(1, hh / 150);
      g.fillStyle = lm ? "#f0a" : h < 0 ? "#b9a" : `hsl(${220 - 200 * t}, 60%, ${70 - 35 * t}%)`;
      poly(pts, true);
      g.fill();
    }
    g.fillStyle = "#fd0";
    poly(d.route.perch, true);
    g.fill();
    g.strokeStyle = "#f30";
    g.lineWidth = 3;
    g.beginPath();
    path.forEach(([x, z], i) => (i ? g.lineTo : g.moveTo).call(g, X(x * 10), Y(z * 10)));
    g.stroke();
    g.fillStyle = "#000";
    g.font = "bold 14px system-ui";
    for (const l of d.landmarks) g.fillText(l.id, X(l.x) + 4, Y(l.z) - 4);
    g.fillRect(20, H - 30, 100 * s, 6);
    g.fillText("100 m", 20, H - 38);
    document.getElementById("info").textContent = `${id}: ${d.buildings.length} buildings, ${d.roads.length} roads; streets ${d.route.streets.join(" → ")}`;
  </script>
</body>
</html>
